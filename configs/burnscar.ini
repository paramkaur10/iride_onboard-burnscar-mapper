; The burn-scar experiment of the paper. PyNAS defaults (pyqnas/src/pynas/config.ini) apply to every option
; not set here.

[Data]
pool = data/pool_v2
train = train
search = heo_search
val = heo_val, phisat2_val
test = heo_test, phisat2_test, s2_test
norm = data/tables/normalisation.json
class_names = clear, fresh, old, cloud, shadow, water
class_weights = 0.166, 0.253, 0.552, 0.602, 3.45, 0.978
target = fresh
group = burn: fresh, old
source_share = heo: 0.5, phisat2_sim: 0.5
teacher = teacher

[Hardware]
; layer types the on-board environment supports: the search used Argotec's list, which is not public;
; left empty, every candidate is still checked to compile for MYRIAD
argos_layers =

[Run]
out = models/pynas
