; PyNAS 1.0 defaults. An experiment's configuration file only needs the options it changes; the effective
; configuration (defaults + file + per-run overrides) is written into every run folder.

[Data]
; folder of the window pool (stored sets: <name>_refl.npy, <name>_mask.npy, <name>_windows.csv, <name>_<teacher>.npy)
pool =
; training set, and the sets each stage scores on (names of stored sets in the pool folder)
train = train
search = heo_search
val = heo_val, phisat2_val
test = heo_test, phisat2_test, s2_test
; normalisation file (json with mean, std and clip per band) and the scale of the stored values
norm =
scale = 10000
; mask values of the classes, in class order, and the no-data value
mask_values = 0, 2, 3, 4, 5, 6
nodata = 255
class_names = clear, fresh, old, cloud, shadow, water
class_weights =
; the class the fitness and the main scores are about, and a group of classes scored together
target = fresh
group = burn: fresh, old
; how often each source is drawn for training, e.g. heo: 0.5, phisat2_sim: 0.5 (empty: every window equally)
source_share =
; suffix of the teacher's stored class probabilities (<set>_<teacher>.npy)
teacher = teacher

[Augment]
enabled = true
gain = 0.9, 1.1
band_gain = 0.95, 1.05
p_shift = 0.5
noise = 0.003

[Space]
; pretrained encoders (codes in pynas/space/genes.py ENCODERS; none = a stride-2 stem of searched width)
encoders = none, eb0, mv2, r18
encoder_depths = 3, 4, 5
encoder_weights = imagenet
stem_widths = 16, 24, 32
; searched layers: each halves the resolution (pooling) and applies one block
blocks = conv, dws, mb, mbse, res
widths = 16, 24, 32, 48, 64, 96, 128
kernels = 3, 5
expansions = 2, 4, 6
activations = relu, silu
pools = max, avg
min_layers_plain = 3
min_layers_encoder = 0
max_layers = 5
; largest downsampling of the network (input size / size of the deepest feature map)
max_stride = 64
; decoder: block, width and number of blocks of every stage
decoder_blocks = conv, dws
decoder_widths = 16, 24, 32, 48, 64, 96
decoder_convs = 1, 2

[Train]
steps = 10000
batch = 16
lr = 0.002
encoder_lr_scale = 1.0
weight_decay = 0.01
warmup = 100
lr_floor = 0.02
grad_clip = 1.0
; fp16: mixed precision in FP16 (onboard models); bf16 or fp32 for models that stay on the ground
precision = fp16
; the last phase starts at final_phase x steps: BatchNorm folded into the convolutions (fold = true) or
; frozen at its statistics (fold = false); the weights are averaged (EMA) over the last phase
final_phase = 0.8
fold = true
ema_decay = 0.999
; distillation weight (0: none) and temperature; soft Dice weight
kd_weight = 0.8
kd_temperature = 1.0
dice_weight = 0.0
seed = 0
; periodic scores on the score sets every eval_every steps (0: only at the end)
eval_every = 0
log_every = 200
loader_workers = auto
time_limit_minutes = 0

[Search]
population = 50
; fitness: the target IoU on the search sets, scene_mean (mean of the per-scene IoUs: every scene weighs the same)
; or pooled (over all pixels); also the score the deployed seed is chosen by on the validation sets
fitness = scene_mean
generations = 3
; objectives, name:max or name:min (iou is the fitness on the search sets; latency_ms, ir_mb, params)
objectives = iou:max, latency_ms:min
crossover = 0.9
; probability that a gene changes (at least one gene of every child changes)
mutation = 0.15
; random draws allowed per generation to find enough new feasible candidates
max_tries = 3000
seed = 0

[Hardware]
; compile: ONNX -> FP16 IR -> compiled for MYRIAD; estimate: size estimate only; off: no check
check = compile
check_workers = 8
ov_env = ~/envs/ov2022
ov_archive = ~/envs/openvino_2022.3.1
nnmeter_env = ~/envs/nnmeter
onnx_opset = 13
onnx_ir_version = 7
max_ir_mb = 5.0
; ArgOS test-suite list of Myriad layers (myriad_compatible_layers.txt); IR layers not in it make a candidate
; infeasible (empty: not checked)
argos_layers =
; nnmeter: predicted Myriad VPU latency; off: none
latency = nnmeter
max_latency_ms =

[Final]
; winner: the feasible candidate with the best search IoU (best_iou); candidates within tie of it count as
; equal and the one with the lowest latency is taken
pick = best_iou
tie = 0.0
; finalist stage (0: none, the search's winner above goes to the final stage): the best <finalists> candidates by
; search fitness are trained like final models (steps, every seed) and compared on [Data] val; those within one
; standard error of the best mean validation fitness count as equal and the lowest predicted latency is taken
finalists = 0
seeds = 0, 1, 2
steps = 40000
eval_every = 5000
; off-the-shelf U-Nets, and the same encoders with the decoder slimmed by hand to fit [Hardware] max_ir_mb
baselines = smp:Unet:efficientnet-b0, smp:Unet:efficientnet-b0:depth=4:decoder=64-32-16-8, smp:Unet:mobilenet_v2:depth=4:decoder=64-32-16-8
; no_kd: the winner without distillation; fp32: the winner trained in FP32 (BatchNorm frozen, not folded)
; and converted afterwards
ablations = no_kd, fp32

[Teacher]
spec = smp:Unet:resnet50
seeds = 0, 1
steps = 20000
lr = 0.0003
warmup = 500
lr_floor = 0.01
precision = bf16
fold = false
kd_weight = 0
dice_weight = 1.0
; predictions averaged over the 8 rotations and flips
tta = true

[Run]
; folder of an experiment's runs and searches
out = models/pynas
gpus = all
