[Task]
type_head=segmentation

[NAS]
; Architecture vocabulary (unchanged from original)
; b=ConvAct c=ConvBnActs e=ConvSE d=DenseNetBlock m=MBConv n=MBConvNoRes
; o=CSPConvBlock p=CSPMBConvBlock R=ResNetBlock r=ReLU g=GELU sg=sigmoid
; s=softmax a=AvgPool M=MaxPool D=Dropout C=2-Layer Classification Head
max_layers=7

[Optimizer]
; 1=GreyWolf 2=ParticleSwarm
optimizer_selection=1

[WANDB]
enabled = false
project = iride-burnscar-nas
entity =
mode = offline
tags = burnscar,fp16,myriad

[QAT]
; FP16-AWARE FINE-TUNE SETTINGS
; Activated by [Precision] train=fp32,fp16 -- governs the fp16 finetune phase only.
enabled = true
mode = fp16
backend = qnnpack
warmup_epochs = 0
; FP16 fine-tune epochs: applied ON TOP of the completed FP32 model
finetune_epochs = 15
per_channel = true
tag = fp16aware
onnx_opset = 13
onnx_name = model_fp16aware.onnx
fp16_stochastic = false
fp16_round_weights = true
; act_clip=12 guards against FP16 overflow (max representable ~65504);
; 12 keeps activations well inside fp16 range after robust normalization
fp16_act_clip = 12.0
fp16_tag = fp16aware

[Precision]
; TWO TRAININGS ONLY:
; 1. fp32 - full training from scratch, saved as .pt for ground deployment
; 2. fp16 - fine-tune from fp32 weights with FP16-aware simulation,
;            saved as .pt for Myriad X deployment
; int8_torch and int8_custom intentionally excluded:
;   int8_torch = Hailo-specific, not target hardware
;   int8_custom = requires Hailo DFC toolchain unavailable here
train = fp32, fp16
test = fp32, fp16
fitness = fp16

; FP32 base training epochs (full convergence budget)
fp32_epochs = 20
; FP16 fine-tune epochs (overrides QAT.finetune_epochs if both set;
; QAT.finetune_epochs is the canonical value used by population.py)
finetune_epochs = 15

[Fitness]
; fp16 GPU IoU + FPS term -- no Myriad hardware available,
; so fitness is measured on GPU only; fp16 simulation makes this
; the best available proxy for Myriad X accuracy
mode = iou_fps
alpha = 1.0
beta = 0.2
lambda = 0.5
; FPS target: on Myriad X a realistic target for this task is ~15 fps
; (much lower than GPU); on GPU this saturates quickly so the FPS term
; mainly differentiates very slow architectures. Tune after first generation.
fps_target = 30

[TorchQAT]
; Unused (int8_torch not in [Precision] train list)
backend = qnnpack

[Myriad]
; NO Myriad hardware available - all evaluation is GPU-only.
; Setting enabled=false bypasses _export_and_eval_myriad calls.
enabled = false

[QuantSim]
; Unused (int8_custom not in [Precision] train list)
weight_bits = 8
weight_per_channel = true
weight_pow2_scale = false
act_bits = 8
act_unsigned = true
act_symmetric = false
act_pow2_scale = false
act_ema_decay = 0.99
freeze_ranges_after = 200

[GA]
; 40 individuals x 2 generations = 80 total model trainings
population_size = 40
batch_size = 16
min_parameters = 100000
; 10MB at FP16 = 5 M parameters (2 bytes/param)
max_parameters = 5000000
nas_subset_n = 25000
max_iterations = 2
logs_dir_GA = ./logs/GA_logs
mating_pool_cutoff = 0.5
mutation_probability = 0.2
n_random = 2
k_best = 2
task = segmentation
training_workers = 1

[GWO]
population_size = 50
max_iterations = 3
logs_dir_GWO = ./logs/GWO_logs

[PSO]
population_size = 50
max_iterations = 3
logs_dir_PSO = ./logs/PSO_logs
cognitive_coefficient = 0.1
social_coefficient = 0.2
inertia_coefficient = 0.8

[Search Space]
bs_min = 1
bs_max = 4
default_bs = 4
log_lr_min = -5.0
log_lr_max = 0.0
default_log_lr = -3.0

[ConvAct]
min_kernel_size = 3
max_kernel_size = 5
min_stride = 1
max_stride = 1
min_padding = 1
max_padding = 2
min_out_channels_coefficient = 4
max_out_channels_coefficient = 32
default_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient = 12

[ConvBnAct]
min_kernel_size = 3
max_kernel_size = 5
min_stride = 1
max_stride = 1
min_padding = 1
max_padding = 2
min_out_channels_coefficient = 4
max_out_channels_coefficient = 32
default_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient = 12

[ConvSE]
min_kernel_size = 3
max_kernel_size = 5
min_stride = 1
max_stride = 1
min_padding = 1
max_padding = 2
min_out_channels_coefficient = 4
max_out_channels_coefficient = 32
default_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient =16

[MBConv]
min_expansion_factor = 3
max_expansion_factor = 6
min_dw_kernel_size = 3
max_dw_kernel_size = 3
min_stride = 1
max_stride = 1
min_padding = 1
max_padding = 1
min_out_channels_coefficient = 4
max_out_channels_coefficient = 32
default_expansion_factor = 4
default_dw_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient = 16

[MBConvNoRes]
min_expansion_factor = 3
max_expansion_factor = 6
min_dw_kernel_size = 3
max_dw_kernel_size = 3
min_stride = 1
max_stride = 1
min_padding = 1
max_padding = 1
min_out_channels_coefficient = 4
max_out_channels_coefficient = 32
default_expansion_factor = 4
default_dw_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient =16

[CSPConvBlock]
min_num_blocks = 1
max_num_blocks = 3
min_out_channels_coefficient = 4
max_out_channels_coefficient = 12
default_num_blocks = 2
default_out_channels_coefficient = 8
default_kernel_size = 3
default_stride = 1
default_padding = 1

[CSPMBConvBlock]
min_expansion_factor = 3
max_expansion_factor = 6
min_dw_kernel_size = 3
max_dw_kernel_size = 3
min_num_blocks = 1
max_num_blocks = 3
min_out_channels_coefficient = 4
max_out_channels_coefficient = 12
default_expansion_factor = 4
default_dw_kernel_size = 3
default_num_blocks = 2
default_out_channels_coefficient = 8

[DenseNetBlock]
min_out_channels_coefficient = 4
max_out_channels_coefficient = 16
default_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient = 8

[ResNetBlock]
min_reduction_factor = 2
max_reduction_factor = 4
min_out_channels_coefficient = 4
max_out_channels_coefficient = 32
default_reduction_factor = 4
default_out_channels_coefficient = 16

[AvgPool]
min_kernel_size = 2
max_kernel_size = 2
min_stride = 1
max_stride = 1
default_kernel_size = 2
default_stride = 2

[MaxPool]
min_kernel_size = 2
max_kernel_size = 2
default_kernel_size = 2
default_stride = 2

[Dropout]
min_dropout_rate = 0.1
max_dropout_rate = 0.5
default_dropout_rate = 0.3

[Upsample]
min_scale_factor = 2
max_scale_factor = 2
default_scale_factor = 2
modes = nearest

[Logging]
fallback_logger = csv
logs_dir = ./logs/tb_logs
conf_matrix_dir = ./logs/tb_logs
checkpoints_dir = ./logs/tb_logs/checkpoints

[Computation]
seed = 42
num_workers = 8
accelerator = gpu
; precision = 16 intentionally left commented - FP16 is handled by
; our custom FP16-aware simulation, NOT by Lightning's AMP, to keep
; the FP16 rounding inside the model graph where we can control it