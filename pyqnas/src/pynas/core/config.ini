[Task]
; segmentation or classification
type_head=segmentation  

[NAS]
; Add a dictionary/guide to writing the architecture_code
; b = ConvAct
; c = ConvBnActs
; e = ConvSE (Conv2d, Bn, Act, Squeeze and Excitation)
; d = DenseNetBlock
; m = MBConv
; n = MBConvNoRes
; o = CSPConvBlock
; p = CSPMBConvBlock
; R = ResNetBlock
; r = ReLU
; g = GELU
; sg = sigmoid
; s = softmax
; a = AvgPool
; M = MaxPool
; D = Dropout
; C = 2-Layer Classification Head
; USE:
; - triplets like "c3g" mean "3 consecutive layers using Conv2D with GELU as the activation function.
; - "p" followed by numbers and activation function like "p2r" would represent a CSPBlock with 2 blocks and ReLU as the activation function.
; - the last letter is the Head, and will always use upper case.
; - the second to last letter indicates the pooling module in use. It will be used after every convolutional layer. (currently)
max_layers=7

[Optimizer]
; Available optimizers of hyperparameter tuning include:
; 1 = GreyWolf
; 2 = ParticleSwarm
optimizer_selection=1

[WANDB]
enabled = false
project = py-q-nas
entity = 
; online | offline | disabled — use offline when auth/network is flaky,
; then upload later with `wandb sync`
mode = offline
tags = quant-robustness

[QAT]
; FP16-AWARE SETTINGS ONLY. This section is read exclusively by the 'fp16'
; precision (qat_utils.read_qat_opts). It is NOT consulted for int8_torch
; (see [TorchQAT]) or int8_custom (see [QuantSim]). 'enabled' is legacy and
; unused; [Precision] train/test controls which variants run.
enabled = false
mode = fp16
backend = qnnpack
warmup_epochs = 1
finetune_epochs = 15
per_channel = true
tag = qat
onnx_opset = 13
onnx_name = temp_model_qat.onnx
fp16_stochastic = false
fp16_round_weights = true
fp16_act_clip = 12.00
fp16_tag = fp16aware

[Precision]
; ---------------------------------------------------------------
; Controls which training and testing variants run per individual.
;
; train: comma-separated list of precisions to train, in order.
;   fp32        — plain FP32 training (always runs first, non-negotiable base)
;   fp16        — FP16-aware fine-tune from FP32 weights (existing qat_utils path)
;   int8_torch  — torch.ao library INT8 QAT fine-tune (paper-2 style, our baseline)
;   int8_custom — hand-written Hailo-scheme fake-quant fine-tune (ours, the contribution)
;
; test: which of the above trained variants to GPU-test after training.
;   Only precisions listed here get a test pass; the rest train-only.
;
; fitness: which precision's GPU test IoU drives GA selection.
;   Must be in the test list; falls back to fp32 automatically if not.
;
; EXAMPLES:
;   FP32 only (baseline, fastest):
;     train = fp32
;     test  = fp32
;     fitness = fp32
;
;   FP32 + both INT8 variants (the delta experiment for supervisor demo):
;     train = fp32, int8_torch, int8_custom
;     test  = fp32, int8_torch, int8_custom
;     fitness = fp32
;
;   FP32 + FP16 + both INT8 (full suite):
;     train = fp32, fp16, int8_torch, int8_custom
;     test  = fp32, fp16, int8_torch, int8_custom
;     fitness = fp16
; ---------------------------------------------------------------
; fp32_ft is the budget-matched CONTROL: plain FP32 finetune from the base
; weights for the same finetune_epochs as the int8 variants. The honest
; quantization cost is (fp32_ft IoU - int8 IoU): same total training budget,
; only difference is quantization.
train = fp32, fp32_ft, int8_torch, int8_custom
test  = fp32, fp32_ft, int8_torch, int8_custom
fitness = int8_custom
; per-phase budgets: base trains toward convergence; finetunes stay short
fp32_epochs = 12
finetune_epochs = 4

[Fitness]
; Composite fitness function. Modes:
;   iou               — fitness = IoU of the fitness precision (plain)
;   iou_fps           — alpha*IoU + beta*min(FPS/fps_target, 1)   [recommended]
;   iou_fps_retention — the above minus lambda*(1 - IoU/IoU_fp32)
;                       (relative retention penalty; needs fp32 in test list)
; The FP32->INT8 gap is always recorded per model in the dataframe
; (column gap_fp32_<precision>) as an analysis metric regardless of mode.
mode = iou_fps
alpha = 1.0
beta = 0.2
lambda = 0.5
; FPS normalization target: term saturates at 1.0 once FPS >= fps_target
fps_target = 100

[TorchQAT]
; Backend for the int8_torch precision (torch.ao library QAT baseline).
; qnnpack (per-tensor weights) | fbgemm (per-channel weights)
backend = qnnpack

[Myriad]
; Set to true only when Docker + OpenVINO image + Myriad X stick are connected.
; Affects fp32 and fp16 variants only (int8 variants are not exportable yet).
enabled = false

[QuantSim]
; Scheme knobs for int8_custom (hand-written Hailo-scheme fake quantization).
; Defaults match the Hailo-8 basic W8A8 scheme.
;
; weight_bits: 4, 8, or 16 (Hailo DFC supports all three)
weight_bits = 8
; per-channel scales for weights (one scale per output channel, dim 0)
weight_per_channel = true
; constrain weight scales to powers of two (ablation — set true to test pow2)
weight_pow2_scale = false
;
; act_bits: 8 or 16
act_bits = 8
; Hailo activations are unsigned uint8 (asymmetric with zero-point)
act_unsigned = true
; set true to test symmetric signed activations (ablation)
act_symmetric = false
; constrain activation scales to powers of two (ablation)
act_pow2_scale = false
; EMA decay for running min/max range observation during training
act_ema_decay = 0.99
; freeze activation observers after this many batches (None = never auto-freeze)
; set to ~1-2 epochs worth of batches for stable ranges before converting
freeze_ranges_after = 200

[GA]
;NOTE:
; - population_size should be an even number.
; - mating_pool_cutoff should be less than 1.
; - mutation_probability should be less than 1.
population_size=20
epochs=4
batch_size=8
max_parameters=5000000
max_iterations=10
logs_dir_GA=./logs/GA_logs
mating_pool_cutoff=0.5
mutation_probability=0.2
n_random=1
k_best=1
task=segmentation
training_workers=1

[GWO]
population_size=20
max_iterations=10
logs_dir_GWO=./logs/GWO_logs

[PSO]
population_size=20
max_iterations=10
logs_dir_PSO=./logs/PSO_logs
cognitive_coefficient=0.1
social_coefficient=0.2
inertia_coefficient=0.8

[Search Space]
; Search space for HYPERPARAMETER TUNING
; Batch size
bs_min=1
bs_max=4
default_bs=4
; Learning rate
log_lr_min=-5.0
log_lr_max=0.0
default_log_lr=-3.0

[ConvAct]
; min and max for each parameter to build the search space
min_kernel_size = 3
max_kernel_size = 5
min_stride = 1
max_stride = 1
min_padding = 1
max_padding = 2
min_out_channels_coefficient = 4
max_out_channels_coefficient = 12
; Default values for the get, getint, getfloat methods in GeneralNetwork
default_kernel_size = 3
default_stride = 1
default_padding = 1
default_out_channels_coefficient = 8

[ConvBnAct]
