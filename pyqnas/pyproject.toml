[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pynas"
version = "1.1.3"
description = "Hardware-aware neural architecture search for segmentation on the Intel Myriad X (OpenVINO 2022.3.1, FP16)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "segmentation-models-pytorch>=0.3",
    "numpy",
    "pandas",
    "matplotlib",
    "onnx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynas = ["config.ini", "hardware/tools/*.py"]

# The Myriad X tools (OpenVINO 2022.3.1, nn-Meter 2.0) need old packages and live in environments of their own,
# made by pynas.hardware.myriad.setup(cfg); they are not dependencies of this package.
